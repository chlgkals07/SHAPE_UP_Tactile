# Manus 글러브 → LEAP Hand 리타게팅 설정 (추적됨, 사용자 공통).
# 사용자별 편 손/주먹 값은 config/manus_calibration.yaml (tools/calibrate_manus.py).
# 설계: docs/superpowers/specs/2026-10-27-manus-leap-retargeting-design.md

# Manus SDK ROS 2 노드의 토픽. 0단계(SDK 확인)에서 실제 이름으로 바꾼다.
topic: /manus_glove_0

# LEAP 관절 ← Manus ergonomics 이름. *_flex는 편 손~주먹 비율 × fist 목표(postures.yaml),
# *_side는 side_gain × (현재 − 편 손). Manus 엄지는 CMC를 MCP, MCP를 PIP, IP를 DIP라 부른다.
# 엄지 대응은 추정이다. 실물에서 --thumb affine으로 보고 조정한다.
joint_map:
  index_mcp_side: IndexMCPSpread
  index_mcp_flex: IndexMCPStretch
  index_pip_flex: IndexPIPStretch
  index_dip_flex: IndexDIPStretch
  middle_mcp_side: MiddleMCPSpread
  middle_mcp_flex: MiddleMCPStretch
  middle_pip_flex: MiddlePIPStretch
  middle_dip_flex: MiddleDIPStretch
  ring_mcp_side: RingMCPSpread
  ring_mcp_flex: RingMCPStretch
  ring_pip_flex: RingPIPStretch
  ring_dip_flex: RingDIPStretch
  thumb_cmc_side: ThumbMCPSpread
  thumb_cmc_flex: ThumbMCPStretch
  thumb_mcp_flex: ThumbPIPStretch
  thumb_ip_flex: ThumbDIPStretch

# *_side 관절 배율 (생략 = 1). 방향이 반대면 -1.
side_gain: {}

# 굽힘–측면 결합 제한: |side| ≤ side_max × (1 − mcp_flex / flex_max) + side_floor (도)
coupling:
  side_max_deg: 20.0
  side_floor_deg: 5.0
  flex_max_deg: 90.0

# 엄지 IK 가중치. 위치 잔차는 m 단위다 (1 cm 오차 = 1e-4).
# opposition/smooth는 2609.06009 값에서 시작, prior는 affine 자세로 당기는 힘. 실물에서 조정.
thumb_ik:
  opposition_weight: 0.2
  prior_weight: 0.01
  smooth_weight: 0.05
  flip_normal: false   # 캘리브레이션에서 엄지 목표가 손바닥 반대편으로 가면 true

one_euro:
  min_cutoff: 0.5
  beta: 0.08

# 실측 open 영점과 URDF 0의 차이 (도). 생략 = 0.
urdf_offset_deg: {}
