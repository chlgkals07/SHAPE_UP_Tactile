[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "control-hub"
version = "0.1.0"
description = "One web page to start, stop and watch every process of the OMY/LEAP/Manus rig (tmux-backed)"
requires-python = ">=3.10"
dependencies = ["PyYAML", "fastapi", "uvicorn[standard]"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "httpx"]

[project.scripts]
control-hub = "control_hub.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
control_hub = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
