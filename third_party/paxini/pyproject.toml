[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paxini-sdk"
version = "0.1.0"
description = "Cross-platform Python SDK + tools for Paxini PX-6AX GEN3 multidimensional tactile sensors."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Jingyi Zou", email = "jingyizou1999@gmail.com" },
]
keywords = ["tactile", "robotics", "paxini", "hall-effect", "force-sensor"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.9"
dependencies = [
    "pyserial>=3.5",
]

[project.optional-dependencies]
viz  = ["rerun-sdk>=0.18"]
char = ["numpy>=1.20", "matplotlib>=3.5"]
test = ["pytest>=7"]
dev  = ["pytest>=7", "rerun-sdk>=0.18", "openpyxl>=3.1", "numpy>=1.20", "matplotlib>=3.5"]

[project.scripts]
paxini         = "paxini_sdk.cli:main"
paxini-smoke   = "paxini_sdk.tools.smoke_test:main"
paxini-smoke-serial = "paxini_sdk.tools.smoke_test_serial:main"
paxini-record  = "paxini_sdk.tools.record:main"
paxini-rerun   = "paxini_sdk.tools.to_rerun:main"
paxini-characterize = "paxini_sdk.tools.characterize:main"

[project.urls]
Repository = "https://github.com/Jingyi-Z/paxini-sdk"
Issues     = "https://github.com/Jingyi-Z/paxini-sdk/issues"

[tool.setuptools.packages.find]
include = ["paxini_sdk*"]

[tool.setuptools.package-data]
paxini_sdk = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
